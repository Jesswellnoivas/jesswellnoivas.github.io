<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex">
<title>Jesswell – fotos</title>
<!--
  Câmara da app da equipa Jesswell Noivas.
  Abre a partir da app (Nova noiva → Tirar fotos). Tira várias fotos seguidas e, em "Terminei",
  entrega-as à janela da app que a abriu. Não guarda nem envia nada para outro sítio.
-->
<style>
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;font-family:-apple-system,Roboto,Arial,sans-serif;height:100vh;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
  #topo{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.6),transparent)}
  #topo button{background:none;border:none;color:#fff;font-size:16px;padding:6px}
  #baixo{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 26px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
  #tiras{display:flex;gap:8px;overflow-x:auto;min-height:62px;margin-bottom:12px}
  #tiras div{position:relative;flex:none;width:54px;height:54px;border-radius:8px;overflow:hidden;border:2px solid #fff}
  #tiras img{width:100%;height:100%;object-fit:cover}
  #tiras button{position:absolute;top:1px;right:1px;width:22px;height:22px;border-radius:11px;border:none;background:rgba(0,0,0,.7);color:#fff;font-size:15px;line-height:22px;padding:0}
  #acoes{display:flex;align-items:center;justify-content:space-between}
  #disparo{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25)}
  #disparo:active{background:#fff}
  #fim{min-width:110px;padding:14px 16px;border-radius:24px;border:none;background:#356853;color:#fff;font-size:16px;font-weight:600}
  #fim:disabled{opacity:.4}
  #erro{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;line-height:1.5;background:#111}
  #erro button{margin-top:18px;padding:12px 20px;border-radius:10px;border:none;background:#356853;color:#fff;font-size:16px}
</style>
</head>
<body>
<video id="v" playsinline autoplay muted></video>
<div id="flash"></div>
<div id="topo"><button id="cancel" onclick="cancelar()">Cancelar</button><span style="font-size:14px;opacity:.85">Uma foto por página</span></div>
<div id="baixo">
  <div id="tiras"></div>
  <div id="acoes"><span style="width:110px"></span><button id="disparo" onclick="disparar()" aria-label="Tirar foto"></button><button id="fim" onclick="terminar()" disabled>Terminei</button></div>
</div>
<div id="erro"><div><div id="msg"></div><button onclick="fechar()">Fechar</button></div></div>
<script>
var MAX = Math.min(20, Number(new URLSearchParams(location.search).get('max')) || 20);
var LADO = 1400, fotos = [], v = document.getElementById('v'), confirmar = false;

function avisar(tipo){ try { if (window.opener) window.opener.postMessage({ tipo: tipo }, '*'); } catch (e) {} }
function erro(m){ document.getElementById('erro').style.display = 'flex'; document.getElementById('msg').textContent = m; }
function desenhar(){
  document.getElementById('tiras').innerHTML = fotos.map(function(f, i){
    return '<div><img src="data:image/jpeg;base64,' + f + '"><button onclick="tirar(' + i + ')">×</button></div>';
  }).join('');
  var b = document.getElementById('fim');
  b.disabled = !fotos.length;
  b.textContent = 'Terminei' + (fotos.length ? ' (' + fotos.length + ')' : '');
  var t = document.getElementById('tiras'); t.scrollLeft = t.scrollWidth;
}
function tirar(i){ fotos.splice(i, 1); desenhar(); }
function disparar(){
  if (!v.videoWidth) return;
  if (fotos.length >= MAX) { erro('Já tem ' + MAX + ' fotos. Carregue em Terminei.'); return; }
  var w = v.videoWidth, h = v.videoHeight, e = Math.min(1, LADO / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * e); c.height = Math.round(h * e);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  fotos.push(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
  var f = document.getElementById('flash'); f.style.opacity = .8; setTimeout(function(){ f.style.opacity = 0; }, 120);
  if (navigator.vibrate) navigator.vibrate(30);
  desenhar();
}
function parar(){ try { v.srcObject.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {} }
function fechar(){ parar(); window.close(); setTimeout(function(){ erro('Pode fechar esta janela e voltar à app.'); }, 400); }
function terminar(){
  if (!window.opener) { erro('Esta página só funciona aberta a partir da app (Nova noiva → Tirar fotos).'); return; }
  parar();
  window.opener.postMessage({ tipo: 'jw-fotos', fotos: fotos }, '*');
  fechar();
}
function cancelar(){
  if (fotos.length && !confirmar) {
    confirmar = true; document.getElementById('cancel').textContent = 'Sair sem guardar?';
    setTimeout(function(){ confirmar = false; document.getElementById('cancel').textContent = 'Cancelar'; }, 3000);
    return;
  }
  fechar();
}
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  avisar('jw-camara-erro');
  erro('Este telemóvel não deixa abrir a câmara aqui. Feche esta janela e use a câmara do telemóvel na app.');
} else {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1440 } }, audio: false })
    .then(function(s){ v.srcObject = s; v.play(); avisar('jw-camara-ok'); },
      function(e){
        // Recusa da autorização: a app oferece a câmara do telemóvel
        avisar('jw-camara-erro');
        erro('Não foi possível abrir a câmara (' + (e && e.name || e) + '). Feche esta janela e use a câmara do telemóvel na app.');
      });
}
avisar('jw-camara-aberta');
window.addEventListener('pagehide', parar);
desenhar();
</script>
</body>
</html>
